name: Feature Request
description: Suggest a new feature or an improvement
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make error-pages better? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you feel something is missing.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
