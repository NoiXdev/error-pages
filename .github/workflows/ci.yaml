name: CI

on:
  # Every branch, so a fast-forward merge to main has already been gated.
  # The branch filter keeps a bare `push:` from firing on release tags too.
  push:
    branches: ["**"]
  pull_request:
  # So release.yaml can gate on these jobs passing on the very ref it releases.
  workflow_call:

permissions:
  contents: read

# Keyed by workflow and event too, so a push run, a pull_request run and a
# run called from release.yaml on the same ref never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, tests, workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: go test
        run: go test -race ./...

      # Both tools are pinned in tools/go.mod (checksums in tools/go.sum),
      # so the main module's go.mod stays free of them.
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint

      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both release platforms are built, nothing is pushed. A multi-platform
      # result cannot be loaded, so the amd64 image is built again from the
      # warm cache and loaded for the smoke test below.
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: error-pages:ci
          cache-from: type=gha

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name ep -p 8089:8080 --read-only error-pages:ci
          for _ in $(seq 1 20); do
            curl -fs -o /dev/null localhost:8089/healthz && break
            sleep 1
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8089/502.html)"
          test "${code}" = "502"
          expected="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' version.json)"
          curl -s localhost:8089/404.html | grep -q "v${expected}"
          docker exec ep /error-pages healthcheck
          docker rm -f ep
