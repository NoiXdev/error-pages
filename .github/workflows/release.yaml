name: Release
run-name: Release ${{ inputs.bump }}${{ inputs.prerelease_id != '' && format('-{0}', inputs.prerelease_id) || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Dispatched by hand. The first release is bump=major with prerelease_id=rc,
# which yields 1.0.0-rc.1 (tag v1.0.0-rc.1). The gates run on the ref being
# released, and the branch guard refuses a dispatch from anywhere but main.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease_id:
        description: "Prerelease identifier; empty promotes to a final version"
        type: string
        default: "rc"
      dry_run:
        description: "Run every gate and build, push nothing"
        type: boolean
        default: false

concurrency: release

permissions:
  contents: write

jobs:
  gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yaml

  release:
    needs: [gates]
    uses: NoiXdev/github-workflows/.github/workflows/create_docker_changelog_version_release.yaml@main
    with:
      bump: ${{ inputs.bump }}
      prerelease_id: ${{ inputs.prerelease_id }}
      dry_run: ${{ inputs.dry_run }}
      platforms: linux/amd64,linux/arm64
      version_file: version.json
      product_name: error-pages
      # The gates ran on this commit; without this the shared workflow would
      # check out whatever main points at by the time they finish.
      ref: ${{ github.sha }}
    # Kept as inherit on purpose: the called workflow declares no secrets under
    # on.workflow_call.secrets, and passing an undeclared secret is an error.
    # It reads DOCKERHUB_USERNAME, DOCKERHUB_TOKEN and
    # DISCORD_WEBHOOK_RELEASE_NOTIFICATION from the inherited set. Switch to an
    # explicit map once github-workflows declares them.
    secrets: inherit
